[package]
name = "pitayas-app"
version = "1.0.3-beta"
edition = "2021"
description = "Pitayas — aplikacja na telefon"
license = "MIT"

[lib]
name = "pitayas_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "io-util", "fs"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
