# Wydanie aplikacji Pitayas (Rust/Tauri, folder app/): APK (Android) i niepodpisane IPA (iPhone, do sideloadu).
# Uruchamia się po wypchnięciu taga v* (np. v1.0.0-beta) albo ręcznie z zakładki Actions.
# Rdzeń i moduły NIE potrzebują wydania — wystarczy `npm run channel` i push (folder updates/).
# Stara aplikacja (Capacitor, foldery android/ i ios/) nie jest już budowana — dostaje tylko aktualizacje OTA.
name: Wydanie aplikacji

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - name: Klucz podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pitayas.jks"
            echo "PITAYAS_KEYSTORE=$RUNNER_TEMP/pitayas.jks" >> "$GITHUB_ENV"
          fi
      - name: Budowanie APK
        working-directory: app
        env:
          PITAYAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PITAYAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PITAYAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm install --no-audit --no-fund
          if [ -n "$PITAYAS_KEYSTORE" ]; then
            npx tauri android build --apk
          else
            echo "::warning::Brak sekretu ANDROID_KEYSTORE_BASE64 — APK podpisany kluczem debug"
            npx tauri android build --apk --debug
          fi
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | grep universal | head -1)
          cp "$APK" "$GITHUB_WORKSPACE/Pitayas.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Pitayas.apk }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-ios' }
      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Budowanie IPA (bez podpisu — podpisuje AltStore / SideStore / Sideloadly)
        working-directory: app
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          npm install --no-audit --no-fund
          npx tauri ios init --ci
          # Bez podpisu: xcodebuild czyta ustawienia z tego pliku (podpisuje dopiero AltStore / SideStore / Sideloadly)
          printf 'CODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=\nDEVELOPMENT_TEAM=\n' > "$RUNNER_TEMP/nosign.xcconfig"
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/nosign.xcconfig"
          # Eksport archiwum bez podpisu się nie uda — to nie szkodzi, bierzemy .app z archiwum
          npx tauri ios build --ci || true
          APP=$(find ~/Library/Developer/Xcode "$PWD/src-tauri/gen/apple" -name '*.app' -path '*Products/Applications*' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then APP=$(find ~/Library/Developer/Xcode "$PWD/src-tauri/gen/apple" -name '*.app' 2>/dev/null | grep -i -E 'release|archive' | head -1); fi
          echo "APP=$APP"
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/Pitayas.ipa" Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: Pitayas.ipa }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Wydanie na GitHubie
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          mv android/Pitayas.apk "Pitayas-$V.apk"
          mv ios/Pitayas.ipa "Pitayas-$V.ipa"
          gh release create "$TAG" "Pitayas-$V.apk" "Pitayas-$V.ipa" --repo "$GITHUB_REPOSITORY" --title "Pitayas $V" --prerelease \
            --notes "Nowa aplikacja Pitayas (Rust/Tauri). Android: zainstaluj Pitayas-$V.apk — zastąpi starą aplikację. iPhone (poza UE): zainstaluj Pitayas-$V.ipa przez AltStore, SideStore albo Sideloadly."
