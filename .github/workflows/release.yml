# Wydanie powłoki Pitayas: APK (Android) i niepodpisane IPA (iPhone, do sideloadu).
# Uruchamia się po wypchnięciu taga v* (np. v0.1.0-beta) albo ręcznie z zakładki Actions.
# Rdzeń i moduły NIE potrzebują wydania — wystarczy `npm run channel` i push (folder updates/).
name: Wydanie aplikacji

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Klucz podpisu
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pitayas.jks"
            echo "PITAYAS_KEYSTORE=$RUNNER_TEMP/pitayas.jks" >> "$GITHUB_ENV"
          fi
      - name: Budowanie APK
        working-directory: android
        env:
          PITAYAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PITAYAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PITAYAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$PITAYAS_KEYSTORE" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Pitayas.apk"
          else
            echo "::warning::Brak sekretu ANDROID_KEYSTORE_BASE64 — APK podpisany kluczem debug (aktualizacja APK wymaga wtedy odinstalowania)"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Pitayas.apk"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Pitayas.apk }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx cap sync ios
      - name: Xcode 26 (Liquid Glass)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Budowanie IPA (bez podpisu — podpisuje AltStore / SideStore / Sideloadly)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Pitayas.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: Pitayas.ipa }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Wydanie na GitHubie
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          mv android/Pitayas.apk "Pitayas-$V.apk"
          mv ios/Pitayas.ipa "Pitayas-$V.ipa"
          gh release create "$TAG" "Pitayas-$V.apk" "Pitayas-$V.ipa" --repo "$GITHUB_REPOSITORY" --title "Pitayas $V" --prerelease \
            --notes "Android: zainstaluj Pitayas-$V.apk. iPhone (poza UE): zainstaluj Pitayas-$V.ipa przez AltStore, SideStore albo Sideloadly."
