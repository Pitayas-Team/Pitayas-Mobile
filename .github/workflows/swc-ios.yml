# Aplikacja „Szkoła w Chmurze” na iPhone (niepodpisane IPA do sideloadu: AltStore, SideStore, Sideloadly).
# Budowana z tego samego projektu co Pitayas (wtyczka natywnego szkła PitayasGlass), ale z ustawieniami z folderu swc-ios/:
# inny identyfikator (com.pitayas.swc), nazwa, ikona, strona zapasowa i adres strony. Uruchamiasz ręcznie: zakładka Actions → „Aplikacja SwC (iOS)” → Run workflow.
# Od 0.5.0: widżety „Passa” i „Otwarte stoły” (WidgetKit, Liquid Glass na przezroczystym ekranie), wtyczka SwcApp (klucz urządzenia dla widżetów)
# i sprawdzanie powiadomień w tle (Background Runner, swc-ios/public/runners/swc-inbox.js). Dokłada je swc-ios/native/add-native.rb – tylko w tej kompilacji.
name: Aplikacja SwC Gry (iOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja aplikacji (np. 0.5.0)'
        default: '0.5.1'
      build:
        description: 'Numer kompilacji (liczba, rośnie przy każdym wydaniu)'
        default: '9'

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Ustawienia aplikacji SwC
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          cp swc-ios/capacitor.config.json capacitor.config.json
          # w UA wersja i numer kompilacji – strona porównuje numer kompilacji (wersje zaczęły się od nowa: 0.5 jest nowsza niż stara 1.0.10)
          sed -i '' "s#SwC-iOS/[0-9.]*#SwC-iOS/$VERSION SwC-Build/$BUILD#" capacitor.config.json
          rm -rf public && mkdir public && cp -R swc-ios/public/. public/
          npx cap sync ios
          # identyfikator, wersja
          P=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s#PRODUCT_BUNDLE_IDENTIFIER = com.pitayas.mobile;#PRODUCT_BUNDLE_IDENTIFIER = com.pitayas.swc;#g; s#MARKETING_VERSION = [0-9.]*;#MARKETING_VERSION = $VERSION;#g; s#CURRENT_PROJECT_VERSION = [0-9]*;#CURRENT_PROJECT_VERSION = $BUILD;#g" "$P"
          # nazwa, adres swc://, sieć
          I=ios/App/App/Info.plist
          B=/usr/libexec/PlistBuddy
          $B -c "Set :CFBundleDisplayName SwC Gry" "$I"
          $B -c "Set :CFBundleName SwC Gry" "$I" 2>/dev/null || $B -c "Add :CFBundleName string SwC Gry" "$I"
          $B -c "Delete :CFBundleURLTypes" "$I" 2>/dev/null || true
          $B -c "Add :CFBundleURLTypes array" -c "Add :CFBundleURLTypes:0 dict" -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.pitayas.swc" -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string swc" "$I"
          $B -c "Delete :NSAppTransportSecurity" "$I" 2>/dev/null || true
          $B -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$I"
          # zadanie w tle (powiadomienia) – ta sama etykieta co w capacitor.config.json
          $B -c "Delete :BGTaskSchedulerPermittedIdentifiers" "$I" 2>/dev/null || true
          $B -c "Add :BGTaskSchedulerPermittedIdentifiers array" -c "Add :BGTaskSchedulerPermittedIdentifiers:0 string com.pitayas.swc.inbox" "$I"
          # SwC nie potrzebuje sieci lokalnej (to dla Deck/Cam w Pitayas) – bez pytania o nią przy starcie
          sed -i '' 's/^        requestLocalNetworkAccess()$/        \/\/ SwC Gry: bez sieci lokalnej/' ios/App/App/AppDelegate.swift
          # ikona i ekran startowy
          cp swc-ios/AppIcon-512@2x.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          for f in ios/App/App/Assets.xcassets/Splash.imageset/*.png; do cp swc-ios/Splash.png "$f"; done
      - name: Widżety i wtyczka SwcApp
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          cp swc-ios/native/SwcAppPlugin.swift swc-ios/native/App.entitlements ios/App/App/
          cp -R swc-ios/native/SwcWidgets ios/App/SwcWidgets
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby swc-ios/native/add-native.rb "$VERSION" "$BUILD"
          # wtyczka z celu App – Capacitor rejestruje klasy z packageClassList
          node -e "const f='ios/App/App/capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.packageClassList=[...new Set([...(c.packageClassList||[]),'SwcAppPlugin'])];require('fs').writeFileSync(f,JSON.stringify(c,null,2));console.log(c.packageClassList.join(', '))"
      - name: Xcode 26 (Liquid Glass)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Budowanie IPA (bez podpisu — podpisuje AltStore / SideStore / Sideloadly)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/App.app/Info.plist
          ls Payload/App.app/PlugIns
          # podpis „ad hoc” z uprawnieniami (wspólne dane aplikacji i widżetów, pilne powiadomienia) –
          # AltStore/SideStore podpisują paczkę od nowa, ale uprawnienia czytają z tego podpisu
          if [ -d Payload/App.app/Frameworks ]; then for f in Payload/App.app/Frameworks/*; do codesign --force --sign - "$f"; done; fi
          codesign --force --sign - --entitlements swc-ios/native/SwcWidgets/SwcWidgets.entitlements Payload/App.app/PlugIns/SwcWidgets.appex
          codesign --force --sign - --entitlements swc-ios/native/App.entitlements Payload/App.app
          codesign -d --entitlements - Payload/App.app/PlugIns/SwcWidgets.appex
          zip -qry SzkolawChmurze.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: SzkolawChmurze-ios, path: SzkolawChmurze.ipa }
