[package]
name = "pitayas-desktop"
version = "1.0.4"
edition = "2021"
description = "Pitayas na komputer — jak aplikacja na telefonie, z trybem telewizora"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pitayas-core = { path = "../core/rust" }
tauri = { version = "2", features = ["image-png", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
